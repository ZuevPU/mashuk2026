<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#E8E2D8" />
    <title>Машук 2026</title>
    <style>
      html, body { margin: 0; width: 100%; overflow-x: hidden; background: #E8E2D8; color: #1A1714; color-scheme: light only; }
      #root { width: 100%; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Early VKWebAppInit before the JS bundle: iOS VK shell can show «не инициализировано» if Init is late -->
    <script>
      (function () {
        try {
          var ios = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.VKWebAppInit;
          if (ios && typeof ios.postMessage === 'function') {
            ios.postMessage({});
            return;
          }
          if (window.AndroidBridge && typeof window.AndroidBridge.VKWebAppInit === 'function') {
            window.AndroidBridge.VKWebAppInit('{}');
            return;
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              handler: 'VKWebAppInit',
              params: {},
              type: 'vk-connect'
            }, '*');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
