<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Итоговый профиль участника — Машук</title>
<style>
@page{size:A4 portrait;margin:14mm 13mm 16mm}
:root{--paper:#faf8f4;--ink:#20242c;--dim:#6b7280;--faint:#9aa1ab;--rule:#e2ded5;
 --pine:#2f6b54;--pine-soft:#e9f0ec;--ochre:#c0862e;--ochre-soft:#f8f0dd;--clay:#b4544c;--sky:#4b7c93}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#8c8f94}
body{font:12pt/1.55 "Charter",Georgia,"Times New Roman",serif;color:var(--ink);
 -webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;min-height:297mm;padding:16mm 15mm 18mm;background:var(--paper);margin:10mm auto;
 box-shadow:0 2px 22px rgba(0,0,0,.28);position:relative}
h1{font-size:26pt;line-height:1.12;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-family:"Inter",Arial,sans-serif;font-size:8.5pt;letter-spacing:.16em;text-transform:uppercase;
 color:var(--pine);font-weight:700;margin:0 0 3mm;padding-bottom:1.6mm;border-bottom:1px solid var(--rule)}
h3{font-size:11.5pt;margin:0 0 1.5mm;font-weight:600}
p{margin:0 0 3mm}
.lede{font-size:12.5pt;line-height:1.5;color:#2c323c}
.muted{color:var(--dim)}
.tiny{font-size:8.5pt;color:var(--faint);font-family:"Inter",Arial,sans-serif;line-height:1.45}
.brand{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:2.5mm}
.brand .m{font-family:"Inter",Arial,sans-serif;font-weight:700;letter-spacing:.22em;font-size:9pt}
.brand .r{font-family:"Inter",Arial,sans-serif;font-size:8.5pt;color:var(--dim)}
.meta{font-family:"Inter",Arial,sans-serif;font-size:9.5pt;color:var(--dim);margin-top:2mm}
.sec{margin-top:8mm}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.num{font-size:30pt;font-weight:600;line-height:1;letter-spacing:-.02em}
.num small{font-size:12pt;font-weight:400;color:var(--dim)}
.cap{font-family:"Inter",Arial,sans-serif;font-size:8.5pt;color:var(--dim);margin-top:2mm;line-height:1.4}
.box{border:1px solid var(--rule);border-radius:3mm;padding:5mm}
.box.soft{background:#fff}
.quote{border-left:2.5px solid var(--ochre);padding-left:4mm;font-size:11.5pt;line-height:1.5}
.pill{display:inline-block;font-family:"Inter",Arial,sans-serif;font-size:8pt;padding:.8mm 2.5mm;border-radius:6mm;
 background:var(--pine-soft);color:var(--pine);font-weight:600}
.pill.o{background:var(--ochre-soft);color:#8a5f16}
.ai{border:1px solid var(--ochre);background:var(--ochre-soft);border-radius:3mm;padding:4.5mm;margin:3mm 0}
.ai-label{font-family:"Inter",Arial,sans-serif;font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;
 color:#8a5f16;font-weight:700;margin-bottom:2mm}
table{width:100%;border-collapse:collapse;font-size:10.5pt}
td,th{padding:2.2mm 2mm;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
th{font-family:"Inter",Arial,sans-serif;font-size:8pt;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.hand{border-bottom:1px solid var(--faint);height:7mm;margin:3mm 0}
.foot{position:absolute;left:15mm;right:15mm;bottom:9mm;display:flex;justify-content:space-between;
 font-family:"Inter",Arial,sans-serif;font-size:7.5pt;color:var(--faint);border-top:1px solid var(--rule);padding-top:2mm}
.legend{display:flex;gap:5mm;flex-wrap:wrap;font-family:"Inter",Arial,sans-serif;font-size:8pt;color:var(--dim);margin-top:3mm}
.legend i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm;margin-right:1.5mm}
.choice{display:inline-block;border:1px solid var(--rule);border-radius:6mm;padding:1.2mm 3mm;margin:0 1.5mm 2mm 0;
 font-family:"Inter",Arial,sans-serif;font-size:8.5pt;color:var(--dim)}
.choice.on{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:600}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:3mm 0}
.timeline .n{font-family:"Inter",Arial,sans-serif;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--pine)}
@media print{html,body{background:#fff}
 .page{margin:0;box-shadow:none;width:auto;min-height:auto;padding:0}
 .page+.page{page-break-before:always}}
</style></head><body>
<div id="doc"></div>
<script>
const PROFILE = __PROFILE_JSON__;
const P=PROFILE, D=document.getElementById('doc');
const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const clamp=(s,n=320)=>{s=String(s||'').trim();return s.length<=n?s:s.slice(0,n).replace(/\s+\S*$/,'')+'…'};
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return n+' '+(m>=11&&m<=14?c:k===1?a:k>=2&&k<=4?b:c)};
const ZC={"Подъём":"#2f6b54","Включение":"#4b7c93","Нейтраль":"#9aa1ab","Усталость":"#c0862e","Риск":"#b4544c"};
const K=P.kopilka||{}, R=P.reflection||{}, S=P.snapshot||{}, B=P.pointB||{}, AI=P.ai||{};
const toWork=(K.toWork||0)+(K.later||0);
const rolesDone=(P.roles||[]).filter(r=>r.result&&r.result!=="Не получилось попробовать").length;
const uniqRoles=[...new Set((P.roles||[]).map(r=>r.role))];
const openA=(P.pointA||[]).filter(x=>x.kind!=='closed');
const closedA=(P.pointA||[]).filter(x=>x.kind==='closed');
const emptyA=!(P.pointA||[]).length;

function aiBox(text, src){
  if(!text) return '';
  return `<div class="ai"><div class="ai-label">AI-сводка</div>
   <p style="margin:0 0 2mm;font-size:11pt">${esc(text)}</p>
   <div class="tiny">${esc(src||'Универсальный текст · можно править')}</div></div>`;
}
function qaList(items){
  if(!(items||[]).length) return '<p class="tiny">Ответа пока нет</p>';
  return items.map(x=>`<div style="margin-bottom:4mm"><div class="tiny" style="margin-bottom:1.5mm">${esc(x.q)}</div>
   <div class="quote">${esc(clamp(x.a,300))}</div></div>`).join('');
}
function zoneCell(v){
  return v
    ? `<span style="display:inline-block;width:100%;height:5mm;border-radius:1mm;background:${ZC[v]}"></span>`
    : `<span style="display:inline-block;width:100%;height:5mm;border-radius:1mm;background:repeating-linear-gradient(45deg,transparent,transparent 1mm,#e2ded5 1mm,#e2ded5 2mm)"></span>`;
}
function energySvg(){
  const pts=(P.energy||[]).map((e,i)=>({x:i,y:e.value}));
  const has=pts.some(p=>p.y!=null);
  const w=420,h=92,pad=10;
  const ys=pts.map(p=>p.y==null?null:Number(p.y));
  const max=has?Math.max(10,...ys.filter(v=>v!=null)):10;
  const line=pts.filter(p=>p.y!=null).map((p,i,a)=>{
    const x=pad+p.x*((w-pad*2)/Math.max(pts.length-1,1));
    const y=h-pad-(Number(p.y)/max)*(h-pad*2);
    return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const labels=(P.energy||[]).map((e,i)=>{
    const x=pad+i*((w-pad*2)/Math.max(pts.length-1,1));
    return `<text x="${x}" y="${h-1}" text-anchor="middle" font-size="8" fill="#9aa1ab">Д${e.day}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="28mm" role="img" aria-label="Энергия">
   <text x="0" y="10" font-size="8" fill="#9aa1ab">Подъём</text>
   <text x="0" y="${h-14}" font-size="8" fill="#9aa1ab">Риск</text>
   ${has?`<path d="${line}" fill="none" stroke="#4b7c93" stroke-width="2"/>`:''}
   ${labels}
  </svg>
  ${has?'':'<p class="tiny">Отдельного значения энергии в этой выгрузке ещё нет — линия появится, когда участник отметит энергию в проверках состояния.</p>'}`;
}
function roleArc(){
  const n=(P.roles||[]).length;
  if(!n) return '';
  const names=uniqRoles.map(esc).join(' → ');
  let p='';
  if(uniqRoles.length===1) p=`«${esc(uniqRoles[0])}» — ${plural(n,'день','дня','дней')}. Повтор роли даёт то, чего не даёт перебор: со второго раза видно не саму роль, а то, что она меняет вокруг.`;
  else p=`${names}. Рамка менялась — и та, к которой вы пришли, отличается от той, с которой начали. Это не «правильнее»: это другой способ смотреть, и вы выбрали его сами.`;
  return `<div class="box soft" style="margin-top:4mm"><h3>Ваша траектория ролей</h3><p style="margin:0;font-size:11pt">${p}</p></div>`;
}
function kopPattern(){
  if(!K.total) return '';
  const share=toWork/(K.total||1);
  const picked=(K.picked||[])[0];
  const extra=picked?` — «${esc(clamp(picked.text,120))}»`:'';
  if(share<0.2) return `<div class="box" style="margin-top:3mm;border-color:var(--ochre)"><h3>Ваш способ работать</h3>
   <p style="margin:0;font-size:11pt">Вы замечаете заметно больше, чем успеваете превратить в решение: ${plural(K.total,'запись','записи','записей')} и ${plural(toWork,'помечена','помечены','помечено')} к переносу${extra}. Это не про объём и не про лень — про переход. Правило на сентябрь: каждая пятая запись заканчивается глаголом.</p></div>`;
  if(share<0.45) return `<div class="box" style="margin-top:3mm;border-color:var(--ochre)"><h3>Ваш способ работать</h3>
   <p style="margin:0;font-size:11pt">Примерно каждая третья ваша запись доходит до намерения, остальные остаются наблюдением. Важно, чтобы отобранное не потерялось в первую неделю после форума.</p></div>`;
  return `<div class="box" style="margin-top:3mm;border-color:var(--ochre)"><h3>Ваш способ работать</h3>
   <p style="margin:0;font-size:11pt">Почти каждая ваша запись — уже решение, а не только наблюдение. Оставляйте место и для записей «просто так».</p></div>`;
}
function riskHint(){
  const days=(P.state||[]).filter(s=>[s.morning,s.day_,s.evening].includes('Риск')).length;
  if(!days) return `<div class="box soft" style="margin-top:4mm"><p style="margin:0;font-size:11pt">Ваша неделя прошла без отметок «риск». Пустые клетки означают, что данных за эти дни нет, а не что вы чего-то не сделали.</p></div>`;
  return `<div class="box soft" style="margin-top:4mm"><p style="margin:0;font-size:11pt">В вашей неделе есть дни, отмеченные как риск. Это нормальная часть плотной смены, но если то же состояние повторится в сентябре без форума — это сигнал, а не характер.</p></div>`;
}
function choiceRow(options, selected){
  const sel=String(selected||'').toLowerCase();
  return options.map(o=>`<span class="choice ${sel&&sel.includes(o.toLowerCase().slice(0,10))?'on':''}">${esc(o)}</span>`).join(' ');
}
function whenRow(selected){
  const opts=['Первые 48 часов','Ближайшие 14 дней','Ближайшие 3 месяца'];
  const sel=String(selected||'').trim();
  if(!sel) return '<p class="tiny">Срок в итоговой анкете не указан</p>';
  const known=opts.find(o=>sel.toLowerCase().includes(o.toLowerCase().slice(0,10)));
  if(known) return `<span class="choice on">${esc(known)}</span>`;
  return `<div class="quote">${esc(sel)}</div>`;
}

const HEAD=`<div style="margin-top:8mm"><h1>${esc(P.person.name)}</h1>
 <div class="meta">${esc(P.person.direction)} · ${esc(P.person.shift)} · группа ${esc(P.person.group)} · ${esc(P.person.from)} — ${esc(P.person.to)}</div></div>`;

const lede=`<div class="sec"><p class="lede">Это не отчёт и не оценка. Это след недели: с чем вы приехали, как прожили дни, что забрали с собой и что решили делать дальше.</p></div>`;

const snap=`<div class="sec"><h2>Твой Машук за 20 секунд</h2>
 <div class="three">
  <div><div class="num">${S.touchpointsDone||0}<small> / ${S.touchpointsTotal||0}</small></div><div class="cap">точек маршрута закрыто</div></div>
  <div><div class="num">${S.reflections||0}</div><div class="cap">осмыслений после блоков</div></div>
  <div><div class="num">${S.roleTries||0}</div><div class="cap">ролевые пробы · ${S.roleDone||0} завершены</div></div>
 </div>
 <p class="tiny" style="margin-top:3mm">Точки маршрута — про присутствие в контуре форума, а не про качество.</p></div>`;

const pointA=`<div class="sec"><h2>Точка А · с чем вы приехали</h2>
 <p class="muted" style="font-size:11pt">Стартовые ответы. Сверка с точкой Б — в конце профиля: рядом «было» и «стало».</p>
 ${emptyA?'<p class="tiny">Входная анкета ещё не заполнена.</p>':''}
 ${openA.length?`<div class="tiny" style="margin-bottom:2mm">Открытый вопрос — своими словами</div>${qaList(openA)}`:''}
 ${closedA.length?`<div class="tiny" style="margin:3mm 0 2mm">Закрытые вопросы — выбор из списка</div>${qaList(closedA)}`:''}
</div>`;

const rhythm=`<div class="sec"><h2>Ритм смены</h2>
 <p class="muted" style="font-size:11pt">Настроение и энергия показаны раздельно, как участник их и отмечал. Уровень настроения — зона, а не число: шкала ползунка искажает картину. Энергия — динамика, поэтому показана линией.</p>
 ${P.startRole?`<div class="box soft" style="margin:3mm 0"><p style="margin:0;font-size:11pt">Стартовая роль по диагностике: <b>${esc(P.startRole)}</b> — определена до начала смены, по результатам входного теста.</p></div>`:''}
 <p class="tiny" style="margin:2mm 0">Настроение, точки маршрута, роль дня</p>
 <table>
  <tr><th style="width:16mm">День</th><th>Утро</th><th>День</th><th>Вечер</th><th style="width:24mm">Точки</th><th style="width:46mm">Роль дня</th></tr>
  ${(P.state||[]).map((s,i)=>{const pp=(P.participation||[])[i], rr=(P.roles||[]).find(r=>r.day===s.day);
   return `<tr><td style="font-weight:600">${s.day}</td><td>${zoneCell(s.morning)}</td><td>${zoneCell(s.day_)}</td><td>${zoneCell(s.evening)}</td>
    <td>${pp&&pp.done!=null?`${pp.done} из ${pp.total}`:'<span class="tiny">—</span>'}</td>
    <td>${rr?esc(rr.role):'<span class="tiny">—</span>'}</td></tr>`}).join('')}
 </table>
 <div class="legend">${Object.entries(ZC).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('')}<span><i style="background:#e2ded5"></i>нет отметки</span></div>
 <h3 style="margin-top:5mm">Энергия</h3>
 ${energySvg()}
 ${riskHint()}
</div>`;

const roles=`<div class="sec"><h2>Ролевые эксперименты</h2>
 <p class="muted" style="font-size:11pt">Роль — не звание, а рамка на один день: попробовать вести себя иначе, чем обычно.</p>
 ${aiBox(AI.roles, (P.roles||[]).filter(r=>r.comment).length
   ? `Сгенерировано на основе ${plural((P.roles||[]).filter(r=>r.comment).length,'комментария','комментариев','комментариев')} к ролям · слова участника, не наши`
   : 'Универсальный текст · можно править')}
 ${(P.roles||[]).length?P.roles.map(r=>`<div style="margin:4mm 0 5mm">
   <div style="display:flex;justify-content:space-between;gap:4mm;align-items:baseline">
    <div><b>День ${r.day}</b> · ${esc(r.role)}</div>
    ${r.result?`<span class="pill ${/Получилось/.test(r.result)?'':'o'}">${esc(r.result)}</span>`:'<span class="tiny">ещё не отмечено</span>'}
   </div>
   ${r.comment?`<div class="quote" style="margin-top:2mm">${esc(clamp(r.comment,280))}</div>`:''}
  </div>`).join(''):'<p class="tiny">Ролевых проб за смену пока нет.</p>'}
 <div class="tiny" style="margin:4mm 0 2mm">Какой ролью вам было естественно действовать во время программы?</div>
 ${B.roleNatural?`<div class="quote">${esc(B.roleNatural)}</div>`:'<div class="hand"></div>'}
 <div class="tiny" style="margin:4mm 0 2mm">Что вы поняли о своём способе действовать?</div>
 ${B.roleInsight?`<div class="quote">${esc(B.roleInsight)}</div>`:'<p class="tiny">Из финальной анкеты (Точка Б) — появится после ответа.</p>'}
 ${roleArc()}
 <p class="tiny" style="margin-top:3mm">Доведены до результата ${rolesDone} из ${(P.roles||[]).length}.</p>
</div>`;

const funnel=`<div class="sec"><h2>Что вы забираете</h2>
 <p class="muted" style="font-size:11pt">Копилка — ${plural(K.total||0,'запись','записи','записей')} за смену, по статусам.</p>
 ${(()=>{const f=[["Замечено · «мысль», «вопрос»",K.thought||0,"#9aa1ab"],["Задумано · «идея»",K.idea||0,"#c0862e"],["К переносу · «в работу», «на будущее»",toWork,"#2f6b54"]];
  const mx=Math.max(...f.map(x=>x[1]),1);
  return f.map(x=>`<div style="display:grid;grid-template-columns:62mm 1fr 12mm;gap:3mm;align-items:center;margin-bottom:3mm">
   <div style="font-size:11pt">${x[0]}</div>
   <div style="height:6mm;background:#efece5;border-radius:1mm;overflow:hidden"><div style="width:${Math.max(x[1]/mx*100,2)}%;height:100%;background:${x[2]}"></div></div>
   <div style="text-align:right;font-weight:600">${x[1]}</div></div>`).join('')})()}
 ${kopPattern()}
</div>`;

const themes=`<div class="sec"><h2>Ваши темы</h2>
 <p class="muted" style="font-size:11pt">Темы — это не отдельный вопрос анкеты, а группировка записей копилки: чем чаще вы сохраняли записи об одном и том же формате, приёме или предмете, тем выше он в списке.</p>
 ${(K.themes||[]).length?(K.themes.map((t,i)=>`<div style="margin:4mm 0 5mm">
   <div style="display:flex;justify-content:space-between;gap:4mm"><h3 style="margin:0">${i+1} ${esc(t.name)}</h3>
    <div class="tiny">${plural(t.n,'запись','записи','записей')}</div></div>
   ${t.quote?`<div class="quote" style="margin-top:2mm">${esc(t.quote)}</div>`:''}
   ${t.note?`<p class="tiny" style="margin:2mm 0 0">${esc(t.note)}</p>`:''}
  </div>`).join('')):'<p class="tiny">Тем пока недостаточно: тема появляется, если есть хотя бы две близкие записи.</p>'}
 ${(K.otherCount||0)?`<div style="margin-top:3mm"><h3>Другое</h3>
  <p class="tiny">Остальные записи копилки, не сгруппированные в отдельную тему (меньше 2 совпадений по формулировке) — показаны только общим счётчиком.</p>
  <div class="tiny">${plural(K.otherCount,'запись','записи','записей')}</div></div>`:''}
 <p class="tiny" style="margin-top:3mm">Три темы — это, как правило, и есть ваш профессиональный запрос на ближайший год. Не форум их придумал: вы приехали с ними, а здесь они проявились.</p>
 ${P.criterion&&P.criterion.note?`<div class="box soft" style="margin-top:3mm"><p style="margin:0;font-size:11pt">${esc(P.criterion.note)}</p></div>`:''}
</div>`;

const reflection=`<div class="sec"><h2>Как вы осмысляли</h2>
 <p class="muted" style="font-size:11pt">Комментарии из работы по осмыслению направлений, из «Уроков о важном» и из открытых уроков после блоков программы.</p>
 <div class="box soft" style="margin-bottom:3mm">
  <h3>Правило отбора — фильтр содержательности</h3>
  <p style="margin:0;font-size:11pt">В этот блок попадают только содержательные записи. Запись остаётся, если в ней есть хотя бы одно из двух: конкретный предмет (приём, тема, идея) или личное действие / обязательство. Запись отсеивается, если это только оценка впечатления без содержания — «класс», «интересно», «понравилось».</p>
 </div>
 ${aiBox(AI.reflection, R.total?`Сгенерировано на основе ${plural(R.total,'текста','текстов','текстов')} после блоков`:'Универсальный текст · можно править')}
 ${(R.items||[]).length?R.items.map(it=>`<div style="margin:4mm 0">
   <div class="tiny" style="margin-bottom:1mm">${esc(it.event)}</div>
   <div class="quote">${esc(clamp(it.text,280))}</div>
  </div>`).join(''):'<p class="tiny">Содержательных осмыслений после блоков пока нет.</p>'}
</div>`;

const theses=`<div class="sec"><h3>Лучшие тезисы дня</h3>
 <p class="muted" style="font-size:11pt">Каждый вечер — главный тезис дня. Со второго дня добавляется вопрос «Как изменилось твоё понимание темы или твоей деятельности после сегодняшней работы?».</p>
 ${(R.theses||[]).length?R.theses.map(t=>`<div style="margin:5mm 0">
   <div class="tiny" style="letter-spacing:.08em">ДЕНЬ ${t.day} · ГЛАВНЫЙ ТЕЗИС ДНЯ</div>
   ${t.thesis?`<div class="quote" style="margin:2mm 0">${esc(t.thesis)}</div>`:'<p class="tiny">Тезиса за этот день нет</p>'}
   <div class="tiny" style="margin:2mm 0 1mm">«Как изменилось твоё понимание темы или твоей деятельности после сегодняшней работы?»</div>
   ${t.change?`<p style="margin:0;font-size:11pt">${esc(t.change)}</p>`:'<p class="tiny">Ответа нет</p>'}
  </div>`).join(''):'<p class="tiny">Вечерних тезисов за смену пока нет.</p>'}
 ${aiBox(AI.theses, (R.theses||[]).length?`Сводка по ${plural(R.theses.length,'ответу','ответам','ответам')} за смену`:'Универсальный текст · можно править')}
</div>`;

const goalMid=`<div class="sec"><h2>Траектория цели</h2>
 <p class="muted" style="font-size:11pt">Промежуточный срез: изменилась/уточнилась ли цель, на какой отметке шкалы вы сейчас, что уже произошло по отношению к цели.</p>
 ${P.goalMid?`<div class="box soft">
   ${P.goalMid.changed?`<p style="margin:0 0 2mm"><b>Срез.</b> ${esc(P.goalMid.changed)}</p>`:''}
   ${P.goalMid.scale!=null?`<p style="margin:0 0 2mm">${esc(P.goalMid.scale)} из 10 по шкале</p>`:''}
   ${P.goalMid.note?`<p class="tiny" style="margin:0">${esc(P.goalMid.note)}</p>`:''}
  </div>`:'<p class="tiny">Данных по промежуточному срезу пока нет — блок появится, когда будет заполнена точка Ж.</p>'}
</div>`;

const compareRows=P.compare||[];
const leftoverB=(B.leftover||[]).filter(it=>!/естественн.*роль|способ.*действов|какой ролью|перв(ого|ый) шаг|планируете использовать|когда планир/.test((it.q||'').toLowerCase()));
const pointB=`<div class="sec"><h2>Точка Б · с чем вы уезжаете</h2>
 <p class="muted" style="font-size:11pt">Сверка со стартом: слева — точка А, справа — ответы из вечерней анкеты, помеченные как точка Б. Вопросы про роль остаются в «Ролевых экспериментах».</p>
 ${compareRows.length?compareRows.map(row=>`<div style="margin-bottom:5mm">
   <div class="tiny" style="margin-bottom:1.5mm">${esc(row.qA)}</div>
   <div class="two">
    <div><div class="tiny" style="margin-bottom:1mm">Было · ${esc(P.person.from)}</div>
     <div class="quote">${esc(clamp(row.aA,240))}</div></div>
    <div><div class="tiny" style="margin-bottom:1mm">Стало · ${esc(P.person.to)}</div>
     ${row.aB?`<div class="quote">${esc(clamp(row.aB,240))}</div>
      ${row.qB&&row.qB!==row.qA?`<div class="tiny" style="margin-top:1.5mm">${esc(row.qB)}</div>`:''}`
      :'<div class="hand"></div><p class="tiny">Точка Б по этому вопросу ещё не заполнена</p>'}</div>
   </div>
  </div>`).join(''):''}
 ${B.goalOutcome||leftoverB.length?`<div class="tiny" style="margin:3mm 0 2mm">Что произошло с вашей целью за время программы?</div>
  ${choiceRow(['Достиг(ла) цели','Цель изменилась','Понял(а), что цель уже не так важна','Не достиг(ла) результата'], B.goalOutcome)}
  ${leftoverB.filter(it=>it.a!==B.goalOutcome).map(it=>`<div style="margin-top:3mm"><div class="tiny" style="margin-bottom:1mm">${esc(it.q)}</div>
   <div class="quote">${esc(clamp(it.a,280))}</div></div>`).join('')}`:''}
 ${!B.completed?`<div class="box soft" style="margin-top:4mm"><p style="margin:0;font-size:11pt">Итоговый профиль дополнится, когда в вечерней анкете появятся ответы с меткой «Точка Б».</p></div>`:''}
</div>`;

const step=`<div class="sec"><h2>Один шаг на 30 дней</h2>
 <div class="timeline">
  <div><div class="n">Старт</div><p style="margin:1mm 0 0;font-size:11pt">${esc(P.person.from)} · цель зафиксирована</p></div>
  <div><div class="n">Срез</div><p style="margin:1mm 0 0;font-size:11pt">${P.goalMid&&P.goalMid.changed?esc(P.goalMid.changed):'цель не менялась'}${P.goalMid&&P.goalMid.scale!=null?` · ${P.goalMid.scale} из 10`:''}</p></div>
  <div><div class="n">Финиш</div><p style="margin:1mm 0 0;font-size:11pt">${esc(P.person.to)}</p></div>
 </div>
 <div class="tiny" style="margin:3mm 0 2mm">Как вы планируете использовать результаты программы? С какого первого шага готовы начать?</div>
 ${P.nextStep?`<div class="quote">${esc(P.nextStep)}</div>`:'<p class="tiny">Первый шаг в итоговой анкете пока не указан</p>'}
 <div class="tiny" style="margin:3mm 0 2mm">Когда планируете сделать этот шаг?</div>
 ${whenRow(P.nextStepWhen)}
</div>`;

const closing=`<div class="sec"><h2>Итог смены</h2>
 <p class="muted" style="font-size:11pt">Общий вывод по всей неделе — собирается последним, когда остальные блоки уже посчитаны.</p>
 ${aiBox(AI.closing, 'Сводка по всем блокам профиля · универсальный текст, можно править')}
</div>
<div class="sec"><h2>Как это устроено</h2><div class="box">
 <p style="margin-bottom:2mm">Профиль собран из стартовой и финальной анкет, ежедневных чек-инов настроения и энергии, обратной связи после блоков программы, копилки и ролевых экспериментов. Мы не сравниваем вас с другими участниками и не выставляем баллов. Пустые места означают, что данных за эти дни нет, а не что вы чего-то не сделали. AI-сводки помечены отдельно и всегда ссылаются на исходные записи.</p>
</div></div>
<div style="margin-top:10mm;padding-top:4mm;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end">
 <div style="max-width:105mm"><p style="font-size:11pt;margin:0">Спасибо за неделю. Дальше — ваша работа, и она интереснее любого форума.</p></div>
 <div class="tiny" style="text-align:right">Сформировано в мини-приложении<br>образовательного форума «Машук»${P.updatedAt?`<br>обновлено ${esc(P.updatedAt)}`:''}</div>
</div>`;

const pages=[
  [HEAD,lede,snap,pointA],
  [rhythm],
  [roles],
  [funnel,themes],
  [reflection],
  [theses],
  [goalMid,pointB,step],
  [closing]
].map(list=>list.join(''));

D.innerHTML=pages.map((inner,i)=>`<div class="page">
 <div class="brand"><span class="m">МАШУК</span><span class="r">Итоговый профиль участника</span></div>
 ${inner}
 <div class="foot"><span>${esc(P.person.name)} · ${esc(P.person.direction)} · ${esc(P.person.group)}</span>
  <span>${i+1} / ${pages.length}</span></div></div>`).join('');
window.PROFILE_MODE='etalon'; window.PROFILE_PAGES=pages.length;
</script></body></html>
