name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'mashuk-backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TIMEWEB_DEPLOY_WEBHOOK: ${{ secrets.TIMEWEB_DEPLOY_WEBHOOK }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mashuk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mashuk-backend/package-lock.json

      - name: Install, migrate, test and build
        working-directory: mashuk-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mashuk?sslmode=disable
          SKIP_VK_SIGN: 'true'
          ADMIN_SECRET: dev-admin-secret
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
          npm test
          npm run build

      - name: Build Docker image
        run: docker build -t mashuk-backend:${{ github.sha }} mashuk-backend

      - name: Deploy to Timeweb (webhook)
        if: ${{ env.TIMEWEB_DEPLOY_WEBHOOK != '' }}
        run: |
          curl -fsS -X POST "$TIMEWEB_DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"service":"backend","sha":"${{ github.sha }}"}'
