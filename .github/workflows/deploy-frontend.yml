name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'mashuk-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TIMEWEB_STATIC_WEBHOOK: ${{ secrets.TIMEWEB_STATIC_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mashuk-frontend/package-lock.json

      - name: Install and Build
        working-directory: mashuk-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            export VITE_API_URL="https://zuevpu-mashuk2026-ae82.twc1.net/api"
          fi
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mashuk-frontend-dist
          path: mashuk-frontend/dist

      - name: Deploy to Timeweb Static (webhook)
        if: ${{ env.TIMEWEB_STATIC_WEBHOOK != '' }}
        run: |
          curl -fsS -X POST "$TIMEWEB_STATIC_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"service":"frontend","sha":"${{ github.sha }}"}'

      - name: Warn if Timeweb webhook secret missing
        if: ${{ env.TIMEWEB_STATIC_WEBHOOK == '' }}
        run: |
          echo "::warning::TIMEWEB_STATIC_WEBHOOK secret is empty — build artifact uploaded but static host was NOT notified. Set the secret in repo Settings → Secrets."
